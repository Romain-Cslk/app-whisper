name: Desktop library validation
on:
  pull_request:
    branches: [desktop-native]
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
      WHISPER_DATA_DIR: ${{ github.workspace }}/.test-user-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest==8.4.2 pytest-qt==4.5.0
      - run: python -m compileall -q src
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m transcripteur_whisper --smoke-test --smoke-report desktop-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-library-validation
          path: |
            test-results.xml
            desktop-smoke.json
